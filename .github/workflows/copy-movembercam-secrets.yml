name: Copy signing secrets to MovemberCam (one time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install GitHub secret encryption library
        run: python -m pip install PyNaCl==1.6.2
      - name: Encrypt signing secrets directly for grahamgilbert/movembercam
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import pathlib
          from nacl import encoding, public
          # Only MovemberCam's GitHub repository can decrypt these sealed values.
          key = public.PublicKey(b"5Q54DU2NqlleycpLyHlylyg/dTrzS0FM3AlYEvFlYhU=", encoding.Base64Encoder())
          box = public.SealedBox(key)
          result = {}
          for name in ["BUILD_CERTIFICATE_BASE64", "P12_PASSWORD", "APPLE_ID", "APPLE_ID_PASSWORD", "APPLE_TEAM_ID"]:
              value = os.environ[name]
              if not value:
                  raise SystemExit("Required source secret is missing: " + name)
              result[name] = {"key_id": "3380204578043523366",
                              "encrypted_value": base64.b64encode(box.encrypt(value.encode())).decode()}
          pathlib.Path("encrypted-movembercam-secrets.json").write_text(json.dumps(result))
          print("Encrypted five signing/notarization secrets for MovemberCam.")
          PY
      - name: Save sealed values for the destination repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-movembercam-secrets
          path: encrypted-movembercam-secrets.json
          retention-days: 1
          if-no-files-found: error
